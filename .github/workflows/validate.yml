name: Validate Android
on:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Synthetic empty-camera endurance minutes (0 through 30)
        default: '0'
        required: false
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned workflow validators
        run: bash scripts/install_validation_tools.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Keep the same Android home for both Gradle builds and the emulator.
          # Moving it after APK assembly regenerates a different debug signer.
          {
            echo "ANDROID_SDK_HOME=$RUNNER_TEMP/omnipose-sdk-user"
            echo "ANDROID_USER_HOME=$RUNNER_TEMP/omnipose-sdk-user/.android"
            echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/omnipose-sdk-user/.android"
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/omnipose-sdk-user/.android/avd"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omnipose-sdk-user/.android/avd"
      - name: Install emulator runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
      - name: Install build and emulator packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Test, lint and build development APKs
        run: |
          python3 scripts/prepush_gate.py --app omni
      - name: Enable runner virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Synthetic emulator launch smoke
        timeout-minutes: 60
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes || '0' }}
        run: bash scripts/ci_android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniPose-validation
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            evidence/
      - name: Upload compact runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniPose-runtime-evidence
          path: |
            evidence/runtime-screens/**/*.png
            evidence/practice-screens/**/*.png
            evidence/instrumentation.txt
            evidence/failure.txt
            evidence/logcat.txt
            evidence/smoke-exit-code.txt
            evidence/prepush-snapshot.json
            app/build/outputs/androidTest-results/**/TEST-*.xml
