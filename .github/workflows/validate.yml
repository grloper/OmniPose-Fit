name: Validate Android
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install build and emulator packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Test, lint and build development APKs
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest bundleRelease --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable runner virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Synthetic emulator launch smoke
        timeout-minutes: 10
        run: |
          mkdir -p evidence
          cleanup() {
            adb logcat -d > evidence/logcat.txt || true
            adb pull /sdcard/journey.mp4 evidence/journey.mp4 || true
            adb emu kill || true
          }
          trap cleanup EXIT
          echo no | avdmanager create avd -n omnipose-ci -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd omnipose-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -camera-front emulated > evidence/emulator.log 2>&1 &
          booted=false
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          [ "$booted" = true ]
          adb install app/build/outputs/apk/debug/app-universal-debug.apk
          adb logcat -c
          adb shell screenrecord --time-limit 60 /sdcard/journey.mp4 > evidence/screenrecord.log 2>&1 &
          recorder=$!
          ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          wait "$recorder"
          adb shell am start -W -n com.grloepr.pushtrack/.MainActivity | tee evidence/launch.txt
          sleep 8
          adb shell pidof com.grloepr.pushtrack > evidence/pid.txt
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml evidence/window.xml
          adb shell screencap -p /sdcard/screen.png
          adb pull /sdcard/screen.png evidence/screen.png
          adb logcat -d > evidence/logcat.txt
          ! grep -q 'FATAL EXCEPTION' evidence/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniPose-validation
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            evidence/
