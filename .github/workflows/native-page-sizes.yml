name: Validate native page sizes
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  native-16kb:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_HOME=$RUNNER_TEMP/omnipose-sdk-user" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/omnipose-sdk-user/.android" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/omnipose-sdk-user/.android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/omnipose-sdk-user/.android/avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omnipose-sdk-user/.android/avd"
      - name: Install emulator runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
      - name: Install build and 16 KB emulator packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis_ps16k;x86_64"
      - name: Test auditor, lint and build exact-head development artifacts
        id: build
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          python3 scripts/test_native_alignment.py
          python3 scripts/test_ci_android_smoke.py
          python3 scripts/test_ci_16kb_smoke.py
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest bundleRelease --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab > evidence/artifact-sha256.txt
          python3 - <<'PYCODE'
          import hashlib, json, zipfile
          def native_hashes(path):
              with zipfile.ZipFile(path) as archive:
                  return {name.rsplit('/', 1)[-1]: hashlib.sha256(archive.read(name)).hexdigest()
                          for name in archive.namelist() if '/x86_64/' in name and name.endswith('.so')}
          release = native_hashes('app/build/outputs/bundle/release/app-release.aab')
          runtime = native_hashes('app/build/outputs/apk/debug/app-universal-debug.apk')
          with open('evidence/runtime-release-native-parity.json', 'w') as report:
              json.dump({'abi': 'x86_64', 'release': release, 'runtime': runtime,
                         'passed': bool(release) and release == runtime}, report, indent=2)
          assert release and release == runtime, 'Runtime APK native bytes differ from unsigned release AAB'
          PYCODE
      - name: Official ELF static release gate (all packaged ABIs)
        id: static
        run: |
          python3 scripts/audit_native_alignment.py app/build/outputs/bundle/release/app-release.aab \
            --require-abi armeabi-v7a --require-abi arm64-v8a --require-abi x86 --require-abi x86_64 \
            --output evidence/native-audit.json
      - name: Verify APK ZIP alignment separately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-universal-debug.apk > evidence/zipalign.txt
      - name: Enable runner virtualization
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Strict 16 KB synthetic camera and pose runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SYSTEM_IMAGE: system-images;android-35;google_apis_ps16k;x86_64
          EXPECTED_PAGE_SIZE: '16384'
        run: bash scripts/ci_android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniPose-native-16kb-validation
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.*
            evidence/
